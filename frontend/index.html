<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ─────────────────────────────────────────────────── -->
    <title>SahaYatra - Confident Commuting</title>
    <meta name="description" content="Join SahaYatra's trusted network of carpoolers. Find rides or offer your empty seats and make commuting greener, cheaper, and more social." />
    <meta name="theme-color" content="#006c49" />

    <!-- ── Favicon ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- ── Resource hints: resolve DNS & open TCP connections early ── -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Unsplash images used on Home page -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Google Maps (used in PostRide / SearchRides) -->
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.gstatic.com" />

    <!-- ── Fonts ────────────────────────────────────────────────── -->
    <!--
      Load only the exact weights used (400, 600, 700, 800).
      display=swap ensures text renders in fallback font immediately.
      font-display:swap prevents invisible text during load.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Material Symbols: load only the subset we use (Outlined style).
      Use display=block to avoid FOIT (flash of invisible text).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background font-body-md text-on-background">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
